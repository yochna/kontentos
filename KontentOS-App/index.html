<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KontentOS — Cutting Room</title>
    <meta
      name="description"
      content="KontentOS — one bench for the whole cut. Bring the raw footage in, leave with a captioned, scheduled post."
    />
    <!-- Every face is vendored under /fonts and declared in src/fonts.css. The icon font is
         preloaded because it is the one face whose absence is visible as text: without it an
         icon prints its own ligature name instead of a glyph. -->
    <link
      rel="preload"
      href="/fonts/material-symbols-outlined-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/syne-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
